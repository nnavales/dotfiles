[window]
maximized=true

[viewer/font]
default-size=uint32 17
minimum-size=uint32 16
serif='IBM Plex Sans'
sans-serif='IBM Plex Sans'
monospace='CommitMono'

[viewer/view]
max-column-count=uint32 1
max-inline-size=uint32 720
max-block-size=uint32 900
line-height=double 1.6
gap=double 0
justify=false
hyphenate=true
autohide-cursor=true
override-font=true
theme='midnight.json'
