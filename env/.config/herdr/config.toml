# herdr configuration (~/.config/herdr/config.toml)

# Show first-run notification setup on startup.
onboarding = false

# Built-in themes: catppuccin, terminal, tokyo-night, dracula, nord,
#                  gruvbox, one-dark, solarized, kanagawa, rose-pine,
#                  vesper

[theme]
name = "terminal"

[theme.custom]

overlay0       = "#8A9698"
subtext0       = "#8a9698"
text           = "#D3D9DA"
accent         = "#A8BEC2"

sidebar_bg     = "#1C1F21"
active_row_bg  = "#2A2F32"
selection_bg   = "#394B5B"

panel_bg       = "#1C1F21"
surface0       = "#1C1F21"
overlay1       = "#8A9698"

surface1       = "#394B5B"
surface_dim    = "#1C1F21"

green          = "#ACEAFE"
yellow         = "#BFBAFA"
teal           = "#89E28E"
red            = "#F7ABD1"
mauve          = "#a8bec2"
blue           = "#79BCF6"
peach          = "#E3B341"


[keys]
prefix = "alt+a"
help = "prefix+?"
detach = "prefix+q"
edit_scrollback = "prefix+e"
copy_mode = ["alt+v", "prefix+["]
reload_config = "prefix+r"
goto = "prefix+g"

new_tab = "alt+t"
close_tab = "alt+q"
close_workspace = "alt+shift+q"
switch_tab = "alt+1..9"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
remote_image_paste = "ctrl+v" # only active in herdr --remote; empty disables raw-key image paste

toggle_sidebar = "prefix+b"
close_pane = "prefix+x"
cycle_pane_next = "prefix+w"
workspace_picker = "prefix+tab"

settings = ""
open_notification_target = ""
rename_tab = ""
rename_pane = ""
previous_tab = ""
next_tab = ""
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""
cycle_pane_previous = ""
zoom = ""
resize_mode = ""
split_vertical = ""
split_horizontal = ""
rename_workspace = ""
navigate_pane_left = ""
navigate_pane_down = ""
navigate_pane_up = ""
navigate_pane_right = ""

# new_workspace = "prefix+shift+n"
# switch_workspace = ""   # optional indexed binding, e.g. "prefix+shift+1..9"

# new_worktree = "prefix+shift+g"
# open_worktree = ""    # optional, unset by default
# remove_worktree = ""  # optional, unset by default; opens confirmation

# Custom commands use the same binding syntax.
# type = "shell" runs detached in the background.
# type = "pane" opens a temporary pane and closes it when the command exits.
# type = "popup" opens a session-modal terminal without changing the tab layout.
# Popup width and height accept terminal cells or percentages such as "80%".
# On Windows, command strings run through cmd.exe /d /c.
# [[keys.command]]
[[keys.command]]
key = "ctrl+f"
type = "popup"
command = "herdr-sessionizer"
width = "80%"
height = "60%"
description = "sessionizer: open or focus workspace"
[[keys.command]]
key = "ctrl+g"
type = "popup"
command = "lazygit"
width = "100%"
height = "100%"
description = "lazygit: git UI"

[ui]
sidebar_collapsed_mode = "hidden"
sidebar_width = 26
sidebar_min_width = 26
sidebar_max_width = 26
mouse_capture = false 
copy_on_select = true
confirm_close = false
prompt_new_tab_name = false
pane_outer_borders = false
pane_gaps = false
tab_bar_position = "bottom"
pane_scrollbars = false
# hide_tab_bar_when_single_tab = false
window_title = ""
status_indicators = "dots"

[ui.sidebar.agents]
row_gap = 0
rows = [["state_icon", "machine", "workspace", "tab"], ["state_text", "agent"]]
[ui.sidebar.spaces]
row_gap = 0
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.toast]
delivery = "terminal" # off to disable

[ui.toast.clipboard]
enabled = false 

[ui.sound]
enabled = false

[session]
# resume_agents_on_restore = true
# startup_per_agent_delay_ms = 100
