$font = GeistMono Nerd Font

general {
    hide_cursor = true
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = false
}

background {
    monitor =
    color = rgb(22, 22, 22)
}

input-field {
    size = 300, 44
    outline_thickness = 2
    inner_color = rgba(22, 22, 22, 0.0) # no fill

    outer_color = rgba(220, 229, 229, 0.5)
    check_color = rgba(220, 229, 229, 0.9)
    fail_color = rgba(220, 229, 229, 0.4)

    font_color = rgb(220, 229, 229)
    fade_on_empty = false
    rounding = 4

    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL

    dots_text_format = *
    dots_size = 0.4
    dots_spacing = 0.3

    hide_input = true

    position = 0, 0
    halign = center
    valign = center
}
