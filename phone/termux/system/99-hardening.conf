# 99-hardening.conf — Termux sshd hardening
# Loaded by: Include .../sshd_config.d/*.conf  (it sits at the top of sshd_config,
# so these directives take precedence over the defaults).

# --- Authentication: public key only ---
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AuthorizedKeysFile .ssh/authorized_keys

# --- General restrictions ---
PermitRootLogin no
MaxAuthTries 3
LoginGraceTime 30
StrictModes yes

# --- Reduce attack surface ---
X11Forwarding no
AllowAgentForwarding no
PermitTunnel no
